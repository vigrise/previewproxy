[package]
name = "previewproxy"
version = "1.7.0"
edition = "2024"
license = "Apache-2.0"
default-run = "previewproxy"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "previewproxy"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper = "1"
tower = "0.5"
tower-http = { version = "0.7", features = [
  "trace",
  "timeout",
  "request-id",
  "cors",
  "normalize-path",
] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", features = [
  "webp",
  "jpeg",
  "png",
  "gif",
  "tiff",
  "bmp",
  "ico",
  "avif",
] }
ab_glyph = "0.2"
ravif = "0.13"
bytemuck = { version = "1", features = ["derive"] }
resvg = "0.47"
psd = "0.3"
jxl-oxide = "0.12"
libheif-rs = { version = "2.7", default-features = false, features = ["v1_17"] }
pdfium-render = "0.9.3"
tempfile = "3"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hex = "0.4"
infer = "0.22"
dashmap = "6"
ipnet = "2"
futures = "0.3"
bytes = "1"
async-trait = "0.1"
aws-sdk-s3 = "1"
aws-config = "1"
urlencoding = "2"
url = "2"
httpdate = "1"
semver = "1"
prometheus = { version = "0.14", features = ["process"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
jpegxl-rs = { version = "0.15", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
jpegxl-rs = { version = "0.15" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
